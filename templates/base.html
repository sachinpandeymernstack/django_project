<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CarePulse Healthcare Management System{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }
        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }
        .glow-blue {
            box-shadow: 0 0 30px -5px rgba(59, 130, 246, 0.25);
        }
    </style>
</head>
<body class="flex flex-col justify-between antialiased selection:bg-blue-500 selection:text-white">
    <!-- Header Navigation -->
    <header class="glass-panel sticky top-0 z-40 px-6 py-4 flex items-center justify-between border-b border-slate-800/80">
        <div class="flex items-center space-x-3">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-blue-500/20">
                🏥
            </div>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    CarePulse Systems
                </h1>
                <p class="text-xs text-slate-400 flex items-center gap-1.5">
                    <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                    Healthcare Management Portal
                </p>
            </div>
        </div>

        <div class="flex items-center space-x-3 text-xs font-medium">
            <a href="http://localhost:3000" target="_blank" class="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold flex items-center space-x-1.5 shadow-md shadow-blue-500/20 transition">
                <span>Open React App (localhost:3000)</span>
                <span>↗</span>
            </a>
            <a href="/admin/" class="px-3.5 py-2 rounded-xl glass-card text-slate-300 hover:text-white transition">
                Admin Panel
            </a>
            <a href="/api/docs/" class="px-3.5 py-2 rounded-xl glass-card text-slate-300 hover:text-white transition">
                API Docs
            </a>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="glass-panel py-6 px-6 text-center text-xs text-slate-500 border-t border-slate-800">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <p>© 2026 CarePulse Systems. All rights reserved.</p>
            <div class="flex items-center space-x-4">
                <a href="http://localhost:3000" target="_blank" class="text-blue-400 hover:underline">React App (Port 3000)</a>
                <span>•</span>
                <a href="/api/docs/" class="text-slate-400 hover:text-white">API Swagger</a>
            </div>
        </div>
    </footer>
</body>
</html>
